name: Android CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-release:
    name: Build Android arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/shiftly-arm64-release.apk

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-arm64-release
          path: dist/shiftly-arm64-release.apk
          retention-days: 30
