name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare release file
        run: cp build/app/outputs/flutter-apk/app-release.apk shiftly-build-${GITHUB_RUN_NUMBER}-android-arm64-v8a.apk

      - name: Publish arm64 APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Shiftly Build #${{ github.run_number }}
          files: |
            shiftly-build-${{ github.run_number }}-android-arm64-v8a.apk
          generate_release_notes: true
          body: |
            Automated Android release from main.

            ## Android download
            - **arm64-v8a**: The only published build, for modern 64-bit ARM Android devices.
