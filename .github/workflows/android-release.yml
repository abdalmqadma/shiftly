name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize Dart formatting
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release files
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk shiftly-${GITHUB_REF_NAME}-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk shiftly-${GITHUB_REF_NAME}-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk shiftly-${GITHUB_REF_NAME}-android-x86_64.apk

      - name: Publish split APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shiftly-${{ github.ref_name }}-android-arm64-v8a.apk
            shiftly-${{ github.ref_name }}-android-armeabi-v7a.apk
            shiftly-${{ github.ref_name }}-android-x86_64.apk
          generate_release_notes: true
          body: |
            ## Android downloads
            - **arm64-v8a**: Most modern Android phones, including 64-bit ARM devices.
            - **armeabi-v7a**: Older 32-bit ARM Android devices.
            - **x86_64**: Android emulators and x86_64 devices.

            Download only the APK that matches your device architecture.
